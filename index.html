<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Station — Eugene, OR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg-primary: #f5f7fa;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0f2f5;
    --text-primary: #1a1a2e;
    --text-secondary: #4a5568;
    --text-muted: #718096;
    --border-color: #e2e8f0;
    --border-light: #edf2f7;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --card-bg: #ffffff;
    --accent: #3182ce;
    --accent-light: #ebf8ff;
    --green: #38a169;
    --red: #e53e3e;
    --orange: #dd6b20;
    --purple: #805ad5;
    --chart-temp: #3182ce;
    --chart-feels: #dd6b20;
    --chart-rain: #805ad5;
    --chart-rain-light: rgba(128,90,213,0.6);
    --chart-rain-bg: rgba(128,90,213,0.08);
    --chart-wind: #38a169;
    --chart-wind-light: #68d391;
    --chart-fill: rgba(49,130,206,0.08);
    --chart-wind-fill: rgba(56,161,105,0.08);
    --chart-grid: rgba(226,232,240,0.8);
    --tooltip-bg: #ffffff;
    --tooltip-border: #e2e8f0;
    --tooltip-text: #1a1a2e;
  }
  [data-theme="dark"] {
    --bg-primary: #1a1a2e;
    --bg-secondary: rgba(255,255,255,0.05);
    --bg-tertiary: rgba(255,255,255,0.03);
    --text-primary: #e8e8e8;
    --text-secondary: #a0aec0;
    --text-muted: #718096;
    --border-color: rgba(255,255,255,0.1);
    --border-light: rgba(255,255,255,0.05);
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
    --card-bg: rgba(255,255,255,0.05);
    --accent: #4facfe;
    --accent-light: rgba(79,172,254,0.1);
    --green: #4ade80;
    --red: #f87171;
    --orange: #fb923c;
    --purple: #a78bfa;
    --chart-temp: #4facfe;
    --chart-feels: #fb923c;
    --chart-rain: #a78bfa;
    --chart-rain-light: rgba(167,139,250,0.7);
    --chart-rain-bg: rgba(167,139,250,0.15);
    --chart-wind: #4ade80;
    --chart-wind-light: #6ee7b7;
    --chart-fill: rgba(79,172,254,0.06);
    --chart-wind-fill: rgba(74,222,128,0.06);
    --chart-grid: rgba(255,255,255,0.08);
    --tooltip-bg: #2d3748;
    --tooltip-border: rgba(255,255,255,0.1);
    --tooltip-text: #e8e8e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary); color: var(--text-primary);
    min-height: 100vh; padding: 20px; transition: background 0.3s, color 0.3s;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .header-left { flex: 1; min-width: 200px; }
  .station-name { font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(56,161,105,0.1); border: 1px solid rgba(56,161,105,0.3); color: var(--green); font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; }
  .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .theme-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; cursor: pointer; font-size: 0.8rem; color: var(--text-secondary); transition: all 0.2s; }
  .theme-toggle:hover { background: var(--accent-light); }
  #last-updated { color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { padding: 10px 20px; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .tab:hover { color: var(--accent); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .section-label { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin: 24px 0 12px; }
  .section-label:first-child { margin-top: 0; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
  .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); animation: fadeUp 0.4s ease both; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .card-label { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .card-value { font-size: 1.5rem; font-weight: 700; line-height: 1; color: var(--text-primary); }
  .card-value span { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
  .card-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }
  .rain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
  .rain-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); animation: fadeUp 0.4s ease both; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
  .records-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
  .record-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); animation: fadeUp 0.4s ease both; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
  .record-value { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); line-height: 1; margin-top: 8px; }
  .record-value span { font-size: 0.75rem; color: var(--text-muted); }
  .record-date { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; }
  .charts-grid { display: grid; gap: 16px; }
  .chart-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); animation: fadeUp 0.4s ease both; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .chart-title { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .chart-wrap { position: relative; height: 220px; }
  .time-controls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .time-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.75rem; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
  .time-btn:hover { border-color: var(--accent); color: var(--accent); }
  .time-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .explorer-form { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
  .form-group input[type="date"] { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); font-size: 0.85rem; }
  .form-group input[type="date"]:focus { outline: none; border-color: var(--accent); }
  .search-btn { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .search-btn:hover { opacity: 0.9; }
  .quick-picks { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick-pick { padding: 6px 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.7rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
  .quick-pick:hover { border-color: var(--accent); color: var(--accent); }
  .monthly-table-wrap { overflow-x: auto; margin-top: 16px; }
  .monthly-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  .monthly-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border-color); color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
  .monthly-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); }
  .monthly-table tr:hover td { background: var(--accent-light); }
  .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 0.85rem; }
  .loading::after { content: ''; display: block; width: 28px; height: 28px; border: 2px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 14px auto 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: rgba(229,62,62,0.1); border: 1px solid rgba(229,62,62,0.3); border-radius: 8px; padding: 14px; color: var(--red); font-size: 0.85rem; margin-bottom: 16px; }
  footer { text-align: center; margin-top: 36px; color: var(--text-muted); font-size: 0.75rem; }
  .info-tip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; background: var(--accent); color: #fff;
    border-radius: 50%; font-size: 10px; font-weight: 700; cursor: help;
    margin-left: 6px; position: relative; vertical-align: middle;
    flex-shrink: 0;
  }
  .info-tip:hover .tip-text, .info-tip:focus .tip-text { display: block; }
  .tip-text {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); width: 260px; max-width: 80vw; padding: 12px;
    background: #1e293b; color: #f8fafc; border-radius: 8px;
    font-size: 0.8rem; font-weight: 400; line-height: 1.5;
    z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: left;
  }
  .tip-text::after {
    content: ''; position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%); border: 6px solid transparent;
    border-top-color: #1e293b;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <div class="station-name">Personal Weather Station — Eugene, OR</div>
      <h1>Weather Dashboard</h1>
      <div id="last-updated">Loading...</div>
    </div>
    <div class="header-right">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-icon">☀️</span> <span id="theme-label">Light</span></button>
    </div>
  </header>
  <div class="tab-bar">
    <button class="tab active" data-tab="live" onclick="switchTab('live')">Live</button>
    <button class="tab" data-tab="explorer" onclick="switchTab('explorer')">Explorer</button>
    <button class="tab" data-tab="monthly" onclick="switchTab('monthly')">Monthly</button>
    <button class="tab" data-tab="records" onclick="switchTab('records')">Records</button>
  </div>
  <div id="error-box"></div>
  <div id="tab-content"><div class="loading">Loading weather data...</div></div>
  <footer>Eugene, OR &bull; Powered by Ambient Weather Network</footer>
</div>
<script>
  // THEME
  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    updateThemeButton();
    if (activeTab === 'live' && liveCache.rows) renderLiveCharts(liveCache.rows);
    if (activeTab === 'explorer' && explorerCache.rows) renderExplorerChart(explorerCache.rows);
    if (activeTab === 'monthly' && monthlyCache.data) renderMonthlyCharts(monthlyCache.data);
  }
  function updateThemeButton() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
    document.getElementById('theme-label').textContent = isDark ? 'Dark' : 'Light';
  }
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  document.addEventListener('DOMContentLoaded', updateThemeButton);

  // CONFIG & STATE
  const SUPABASE_URL = 'https://qafjqqnwnxzeluikjhoz.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZmpxcW53bnh6ZWx1aWtqaG96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMzY1ODMsImV4cCI6MjA5MTYxMjU4M30.zdqSoeNxSH316m12PcbhNjRoJuWJz6s_klJLvuDuBdE';
  const H = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
  let activeTab = 'live', currentRange = 1, charts = {};
  let liveCache = {}, explorerCache = {}, monthlyCache = {}, recordsCache = {};

  // HELPERS
  function getChartDefaults() {
    const s = getComputedStyle(document.documentElement);
    return { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:s.getPropertyValue('--tooltip-bg').trim(),borderColor:s.getPropertyValue('--tooltip-border').trim(),borderWidth:1,titleColor:s.getPropertyValue('--text-muted').trim(),bodyColor:s.getPropertyValue('--tooltip-text').trim(),titleFont:{size:10},bodyFont:{size:12},padding:10}},
      scales:{x:{grid:{color:s.getPropertyValue('--chart-grid').trim()},ticks:{color:s.getPropertyValue('--text-muted').trim(),font:{size:9},maxTicksLimit:8}},y:{grid:{color:s.getPropertyValue('--chart-grid').trim()},ticks:{color:s.getPropertyValue('--text-muted').trim(),font:{size:9}}}}
    };
  }
  function windDir(deg){if(deg==null)return'--';const d=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return d[Math.round(deg/22.5)%16];}
  function formatTime(ts,rangeDays){const d=new Date(ts);if(rangeDays<=1)return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(rangeDays<=7)return d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString([],{month:'short',day:'numeric'});}
  function fmt(val,dec=1){return val!=null?Number(val).toFixed(dec):'--';}
  function formatDate(ts){return new Date(ts).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});}
  function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={};}

  function computeRangeStats(rows) {
    const valid=(arr,key)=>arr.filter(r=>r[key]!=null);
    const temps=valid(rows,'temp_outdoor'),winds=valid(rows,'wind_speed'),gusts=valid(rows,'wind_gust'),rains=valid(rows,'rain_hourly');
    let hotRow=null,coldRow=null;
    for(const r of temps){if(!hotRow||r.temp_outdoor>hotRow.temp_outdoor)hotRow=r;if(!coldRow||r.temp_outdoor<coldRow.temp_outdoor)coldRow=r;}
    let gustRow=null;for(const r of gusts){if(!gustRow||r.wind_gust>gustRow.wind_gust)gustRow=r;}
    let rainRow=null;for(const r of valid(rows,'rain_daily')){if(!rainRow||r.rain_daily>rainRow.rain_daily)rainRow=r;}
    const avgTemp=temps.length?temps.reduce((s,r)=>s+r.temp_outdoor,0)/temps.length:null;
    const avgWind=winds.length?winds.reduce((s,r)=>s+r.wind_speed,0)/winds.length:null;
    const humids=valid(rows,'humidity_outdoor');
    const avgHumidity=humids.length?humids.reduce((s,r)=>s+r.humidity_outdoor,0)/humids.length:null;
    const dailyMaxRain={};for(const r of valid(rows,'rain_daily')){const day=r.recorded_at.substring(0,10);if(!dailyMaxRain[day]||r.rain_daily>dailyMaxRain[day])dailyMaxRain[day]=r.rain_daily;}
    const totalRain=Object.values(dailyMaxRain).reduce((s,v)=>s+v,0);
    let maxRainRate=0;for(const r of rains){if(r.rain_hourly>maxRainRate)maxRainRate=r.rain_hourly;}
    return{hot:hotRow,cold:coldRow,gustRow,rainRow,avgTemp,avgWind,avgHumidity,totalRain,maxRainRate};
  }

  async function fetchRows(since,until){
    let rows=[],offset=0;
    let url=`${SUPABASE_URL}/rest/v1/weather_data?recorded_at=gte.${since}&order=recorded_at.asc&limit=1000`;
    if(until)url+=`&recorded_at=lte.${until}`;
    while(true){const res=await fetch(url+`&offset=${offset}`,{headers:H});if(!res.ok)throw new Error(`HTTP ${res.status}`);const page=await res.json();rows=rows.concat(page);if(page.length<1000)break;offset+=1000;}
    return rows;
  }
  // Thin rows for charts — keep every Nth point to max ~500 points
  function thinForChart(rows, maxPoints=500) {
    if (rows.length <= maxPoints) return rows;
    const step = Math.ceil(rows.length / maxPoints);
    const thinned = [];
    for (let i = 0; i < rows.length; i += step) thinned.push(rows[i]);
    // Always include the last point
    if (thinned[thinned.length-1] !== rows[rows.length-1]) thinned.push(rows[rows.length-1]);
    return thinned;
  }
  async function fetchRecords(){
    const base=`${SUPABASE_URL}/rest/v1/weather_data`;
    const[hotR,coldR,rainR,gustR]=await Promise.all([
      fetch(`${base}?select=temp_outdoor,recorded_at&temp_outdoor=not.is.null&order=temp_outdoor.desc.nullslast&limit=1`,{headers:H}),
      fetch(`${base}?select=temp_outdoor,recorded_at&temp_outdoor=not.is.null&order=temp_outdoor.asc.nullslast&limit=1`,{headers:H}),
      fetch(`${base}?select=rain_daily,recorded_at&rain_daily=not.is.null&order=rain_daily.desc.nullslast&limit=1`,{headers:H}),
      fetch(`${base}?select=wind_gust,recorded_at&wind_gust=not.is.null&order=wind_gust.desc.nullslast&limit=1`,{headers:H})]);
    const[hot,cold,rain,gust]=await Promise.all([hotR.json(),coldR.json(),rainR.json(),gustR.json()]);
    return{hot:hot[0],cold:cold[0],rain:rain[0],gust:gust[0]};
  }
  async function fetchYTD(){
    const base=`${SUPABASE_URL}/rest/v1/weather_data`,year=new Date().getFullYear(),cm=new Date().getMonth();let ytd=0;const fetches=[];
    for(let m=0;m<cm;m++){const s=new Date(year,m,1).toISOString(),e=new Date(year,m+1,1).toISOString();fetches.push(fetch(`${base}?select=rain_monthly&rain_monthly=not.is.null&recorded_at=gte.${s}&recorded_at=lt.${e}&order=recorded_at.desc&limit=1`,{headers:H}).then(r=>r.json()));}
    fetches.push(fetch(`${base}?select=rain_monthly&rain_monthly=not.is.null&recorded_at=gte.${new Date(year,cm,1).toISOString()}&order=recorded_at.desc&limit=1`,{headers:H}).then(r=>r.json()));
    const results=await Promise.all(fetches);for(const res of results){if(res[0]?.rain_monthly!=null)ytd+=res[0].rain_monthly;}
    return ytd>0?ytd.toFixed(2):'--';
  }

  // EUGENE CLIMATE DATA
  async function fetchEugeneToday() {
    // NWS API for real-time Eugene Airport data (no token, no lag)
    let nwsToday = null;
    try {
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const nwsRes = await fetch(`https://api.weather.gov/stations/KEUG/observations?start=${todayStart.toISOString()}&limit=200`,
        {headers:{'User-Agent':'WeatherDashboard/1.0'}});
      const nwsData = await nwsRes.json();
      const obs = nwsData.features || [];
      const temps = obs.map(f => f.properties?.temperature?.value).filter(v => v != null).map(c => c*9/5+32);
      if (temps.length) {
        nwsToday = { high: Math.round(Math.max(...temps)*10)/10, low: Math.round(Math.min(...temps)*10)/10, observations: temps.length };
      }
      // Also get yesterday
      const yestStart = new Date(todayStart - 86400000);
      const nwsYest = await fetch(`https://api.weather.gov/stations/KEUG/observations?start=${yestStart.toISOString()}&end=${todayStart.toISOString()}&limit=200`,
        {headers:{'User-Agent':'WeatherDashboard/1.0'}});
      const yestData = await nwsYest.json();
      const yTemps = (yestData.features || []).map(f => f.properties?.temperature?.value).filter(v => v != null).map(c => c*9/5+32);
      if (yTemps.length) {
        nwsToday.yesterdayHigh = Math.round(Math.max(...yTemps)*10)/10;
        nwsToday.yesterdayLow = Math.round(Math.min(...yTemps)*10)/10;
      }
    } catch(e) { console.warn('NWS fetch failed:', e); }

    // Get today's normals from Supabase (NOAA historical)
    const mm = String(new Date().getMonth()+1).padStart(2,'0');
    const dd = String(new Date().getDate()).padStart(2,'0');
    let todayNormal = null;
    const years = [];
    for (let y = 2020; y <= new Date().getFullYear(); y++) years.push(`date.eq.${y}-${mm}-${dd}`);
    try {
      const normRes = await fetch(`${SUPABASE_URL}/rest/v1/eugene_climate?or=(${years.join(',')})&limit=1`, {headers:H});
      const normData = await normRes.json();
      todayNormal = normData[0] || null;
    } catch(e) {}

    // Fallback to NOAA historical if NWS fails
    let noaaLatest = null;
    if (!nwsToday) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/eugene_climate?order=date.desc&limit=1`, {headers:H});
        const data = await res.json();
        noaaLatest = data[0] || null;
      } catch(e) {}
    }

    return { nwsToday, todayNormal, noaaLatest };
  }
  async function fetchEugeneMonthly(year) {
    const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const res = await fetch(`${SUPABASE_URL}/rest/v1/eugene_climate?date=gte.${year}-01-01&date=lte.${year}-12-31&order=date.asc`, {headers:H});
    const rows = await res.json();
    // Group by month
    const byMonth = {};
    for (const r of rows) {
      const m = parseInt(r.date.substring(5,7)) - 1;
      if (!byMonth[m]) byMonth[m] = {rain:0, temps:[], highs:[], lows:[], normals_high:[], normals_low:[]};
      if (r.prcp != null) byMonth[m].rain += r.prcp;
      if (r.tmax != null) { byMonth[m].temps.push((r.tmax+r.tmin)/2); byMonth[m].highs.push(r.tmax); byMonth[m].lows.push(r.tmin); }
      if (r.normal_tmax != null) byMonth[m].normals_high.push(r.normal_tmax);
      if (r.normal_tmin != null) byMonth[m].normals_low.push(r.normal_tmin);
    }
    return Object.keys(byMonth).map(m => {
      const d = byMonth[m];
      const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
      return { month: monthNames[m], rain: d.rain, avgTemp: avg(d.temps), high: d.highs.length ? Math.max(...d.highs) : null, low: d.lows.length ? Math.min(...d.lows) : null, normalHigh: avg(d.normals_high), normalLow: avg(d.normals_low) };
    });
  }
  async function fetchEugeneThisDay() {
    // Get all data for today's month-day across available years
    const now = new Date();
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const dd = String(now.getDate()).padStart(2,'0');
    // Build OR query for each year we might have data
    const years = [];
    for (let y = 2020; y <= now.getFullYear(); y++) years.push(`date.eq.${y}-${mm}-${dd}`);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/eugene_climate?or=(${years.join(',')})&order=date.desc`, {headers:H});
    return await res.json();
  }

  function renderExplorerChart(rows){
    if(charts.explorerTemp)charts.explorerTemp.destroy();
    if(charts.explorerRain)charts.explorerRain.destroy();
    const normals = explorerCache.normals || [];
    const rangeDays=Math.max(1,Math.round((new Date(explorerCache.endVal)-new Date(explorerCache.startVal))/86400000)+1);
    const chartRows = thinForChart(rows);
    const labels=chartRows.map(r=>formatTime(r.recorded_at,rangeDays));
    const s=getComputedStyle(document.documentElement),d=getChartDefaults();

    // Build normals lookup by date (YYYY-MM-DD)
    const normByDate = {};
    for (const n of normals) normByDate[n.date] = n;

    // Map each chart row to its day's normal
    const normalHigh = chartRows.map(r => { const day = r.recorded_at.substring(0,10); return normByDate[day]?.normal_tmax ?? null; });
    const normalLow = chartRows.map(r => { const day = r.recorded_at.substring(0,10); return normByDate[day]?.normal_tmin ?? null; });

    // Running average (24-reading window ~2 hours, or longer for multi-day)
    const windowSize = Math.max(12, Math.min(144, Math.round(chartRows.length / 10)));
    const runningAvg = chartRows.map((r, i) => {
      const start = Math.max(0, i - windowSize);
      const slice = chartRows.slice(start, i + 1).filter(x => x.temp_outdoor != null);
      return slice.length ? Math.round(slice.reduce((s, x) => s + x.temp_outdoor, 0) / slice.length * 10) / 10 : null;
    });

    // Temp chart with normal band + running average
    const orangeColor = s.getPropertyValue('--orange').trim();
    charts.explorerTemp=new Chart(document.getElementById('explorerTempChart'),{type:'line',data:{labels,datasets:[
      {label:'Normal High',data:normalHigh,borderColor:'transparent',backgroundColor:orangeColor+'30',borderWidth:0,pointRadius:0,tension:0.4,fill:'+1',order:3},
      {label:'Normal Low',data:normalLow,borderColor:'transparent',backgroundColor:'transparent',borderWidth:0,pointRadius:0,tension:0.4,fill:false,order:3},
      {label:'Running Avg',data:runningAvg,borderColor:orangeColor,borderWidth:2.5,pointRadius:0,tension:0.4,borderDash:[],fill:false,order:1},
      {label:'Actual',data:chartRows.map(r=>r.temp_outdoor),borderColor:s.getPropertyValue('--chart-temp').trim(),backgroundColor:s.getPropertyValue('--chart-fill').trim(),borderWidth:1.5,pointRadius:0,tension:0.4,fill:false,order:2}
    ]},options:{...d,scales:{...d.scales,y:{...d.scales.y,ticks:{...d.scales.y.ticks,callback:v=>v+'°F'}}}}});

    // Rain chart: cumulative actual vs cumulative normal
    // Build cumulative rain from rain_daily (resets at midnight, so carry over day totals)
    let carryOver = 0, lastDay = null, lastDailyMax = 0;
    const accumData = chartRows.map(r => {
      const day = r.recorded_at.substring(0,10);
      const rd = r.rain_daily || 0;
      if (lastDay && day !== lastDay) { carryOver += lastDailyMax; lastDailyMax = 0; }
      if (rd > lastDailyMax) lastDailyMax = rd;
      lastDay = day;
      return Math.round((carryOver + rd) * 100) / 100;
    });

    // Build cumulative normal precip (sum daily normals)
    let cumNormal = 0;
    const normalCumByDate = {};
    const sortedDates = Object.keys(normByDate).sort();
    for (const date of sortedDates) {
      cumNormal += (normByDate[date].prcp || 0);
      normalCumByDate[date] = Math.round(cumNormal * 100) / 100;
    }
    const normalCumData = chartRows.map(r => {
      const day = r.recorded_at.substring(0,10);
      return normalCumByDate[day] ?? null;
    });

    charts.explorerRain=new Chart(document.getElementById('explorerRainChart'),{type:'bar',data:{labels,datasets:[
      {label:'Rain Rate',data:chartRows.map(r=>r.rain_hourly),backgroundColor:s.getPropertyValue('--chart-rain-light').trim(),borderRadius:2,yAxisID:'y',order:3},
      {label:'Your Total',data:accumData,borderColor:s.getPropertyValue('--green').trim(),backgroundColor:'transparent',borderWidth:2.5,pointRadius:0,tension:0.4,type:'line',yAxisID:'y1',order:1},
      {label:'Normal Total',data:normalCumData,borderColor:orangeColor,backgroundColor:'transparent',borderWidth:2,pointRadius:0,tension:0.4,borderDash:[6,3],type:'line',yAxisID:'y1',order:2}
    ]},options:{...d,scales:{x:d.scales.x,y:{...d.scales.y,position:'left',title:{display:true,text:'Rate (in/hr)',color:s.getPropertyValue('--text-muted').trim(),font:{size:10}},ticks:{...d.scales.y.ticks,callback:v=>v+'"'}},y1:{...d.scales.y,position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'Cumulative (in)',color:s.getPropertyValue('--text-muted').trim(),font:{size:10}},ticks:{...d.scales.y.ticks,callback:v=>v+'"'}}}}});
  }

  // MONTHLY TAB
  async function loadMonthlyTab(){
    const tc=document.getElementById('tab-content');
    if(monthlyCache.data){renderMonthlyTab();return;}
    tc.innerHTML='<div class="loading">Loading monthly data...</div>';
    try{
      const base=`${SUPABASE_URL}/rest/v1/weather_data`,year=new Date().getFullYear(),cm=new Date().getMonth();
      const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const fetches=[];
      for(let m=0;m<=Math.min(cm,11);m++){
        const start=new Date(year,m,1).toISOString(),end=new Date(year,m+1,1).toISOString();
        fetches.push(Promise.all([
          fetch(`${base}?select=rain_monthly&rain_monthly=not.is.null&recorded_at=gte.${start}&recorded_at=lt.${end}&order=recorded_at.desc&limit=1`,{headers:H}).then(r=>r.json()),
          fetch(`${base}?select=temp_outdoor&temp_outdoor=not.is.null&recorded_at=gte.${start}&recorded_at=lt.${end}&order=temp_outdoor.desc.nullslast&limit=1`,{headers:H}).then(r=>r.json()),
          fetch(`${base}?select=temp_outdoor&temp_outdoor=not.is.null&recorded_at=gte.${start}&recorded_at=lt.${end}&order=temp_outdoor.asc.nullslast&limit=1`,{headers:H}).then(r=>r.json()),
          fetch(`${base}?select=temp_outdoor&temp_outdoor=not.is.null&recorded_at=gte.${start}&recorded_at=lt.${end}&limit=500`,{headers:H}).then(r=>r.json()),
        ]));
      }
      const[results, eugeneData]=await Promise.all([Promise.all(fetches), fetchEugeneMonthly(year)]);
      const data=results.map((r,i)=>{const[rainRes,highRes,lowRes,tempsRes]=r;return{month:monthNames[i],rain:rainRes[0]?.rain_monthly??null,high:highRes[0]?.temp_outdoor??null,low:lowRes[0]?.temp_outdoor??null,avgTemp:tempsRes.length?tempsRes.reduce((s,t)=>s+t.temp_outdoor,0)/tempsRes.length:null};});
      monthlyCache={data,year,eugeneData};renderMonthlyTab();
    }catch(err){tc.innerHTML=`<div class="error">${err.message}</div>`;}
  }
  function renderMonthlyTab(){
    const{data,year,eugeneData}=monthlyCache;
    const eMap={};(eugeneData||[]).forEach(e=>{eMap[e.month]=e;});
    const tableRows=data.map(d=>{const e=eMap[d.month]||{};return`<tr><td>${d.month}</td><td>${fmt(d.rain,2)}</td><td>${fmt(e.rain,2)}</td><td>${fmt(d.avgTemp,1)}</td><td>${fmt(d.high,1)}</td><td>${fmt(d.low,1)}</td><td>${fmt(e.high,0)}</td><td>${fmt(e.low,0)}</td></tr>`;}).join('');
    document.getElementById('tab-content').innerHTML=`
      <div class="section-label">Monthly Overview — ${year} <span class="info-tip">?<span class="tip-text">Purple bars = your station. Orange bars = Eugene Airport official totals. Temperature lines compare your station (solid) to official records (dashed). Data from NOAA Climate Data Online.</span></span></div>
      <div class="charts-grid">
        <div class="chart-card"><div class="chart-header"><div class="chart-title">Monthly Precipitation</div><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--chart-rain)"></div>Your Station</div><div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Eugene Official</div></div></div><div class="chart-wrap"><canvas id="monthlyRainChart"></canvas></div></div>
        <div class="chart-card"><div class="chart-header"><div class="chart-title">Monthly Temperature</div><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Your High</div><div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Your Avg</div><div class="legend-item"><div class="legend-dot" style="background:var(--chart-wind)"></div>Your Low</div><div class="legend-item"><div class="legend-dot" style="background:var(--orange);opacity:0.5"></div>Official High/Low</div></div></div><div class="chart-wrap"><canvas id="monthlyTempChart"></canvas></div></div>
      </div>
      <div class="monthly-table-wrap"><table class="monthly-table">
        <thead><tr><th>Month</th><th>Your Rain</th><th>Official Rain</th><th>Avg Temp</th><th>Your High</th><th>Your Low</th><th>Official High</th><th>Official Low</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>`;
    renderMonthlyCharts(data);
  }
  function renderMonthlyCharts(data){
    if(charts.monthlyRain)charts.monthlyRain.destroy();if(charts.monthlyTemp)charts.monthlyTemp.destroy();
    const labels=data.map(d=>d.month),s=getComputedStyle(document.documentElement),d=getChartDefaults();
    const eMap={};(monthlyCache.eugeneData||[]).forEach(e=>{eMap[e.month]=e;});
    const eugeneRain=labels.map(m=>eMap[m]?.rain??null);
    const eugeneHigh=labels.map(m=>eMap[m]?.high??null);
    const eugeneLow=labels.map(m=>eMap[m]?.low??null);
    charts.monthlyRain=new Chart(document.getElementById('monthlyRainChart'),{type:'bar',data:{labels,datasets:[
      {label:'Your Station',data:data.map(d=>d.rain),backgroundColor:s.getPropertyValue('--chart-rain-light').trim(),borderColor:s.getPropertyValue('--chart-rain').trim(),borderWidth:1,borderRadius:4},
      {label:'Eugene Official',data:eugeneRain,backgroundColor:s.getPropertyValue('--orange').trim()+'99',borderColor:s.getPropertyValue('--orange').trim(),borderWidth:1,borderRadius:4}
    ]},options:{...d,scales:{...d.scales,y:{...d.scales.y,ticks:{...d.scales.y.ticks,callback:v=>v+'"'}}}}});
    charts.monthlyTemp=new Chart(document.getElementById('monthlyTempChart'),{type:'line',data:{labels,datasets:[
      {label:'Your High',data:data.map(d=>d.high),borderColor:s.getPropertyValue('--red').trim(),borderWidth:2,pointRadius:3,tension:0.3,fill:false},
      {label:'Your Avg',data:data.map(d=>d.avgTemp),borderColor:s.getPropertyValue('--accent').trim(),borderWidth:2,pointRadius:3,tension:0.3,fill:false},
      {label:'Your Low',data:data.map(d=>d.low),borderColor:s.getPropertyValue('--chart-wind').trim(),borderWidth:2,pointRadius:3,tension:0.3,fill:false},
      {label:'Official High',data:eugeneHigh,borderColor:s.getPropertyValue('--orange').trim(),borderWidth:2,pointRadius:3,tension:0.3,borderDash:[4,3],fill:false},
      {label:'Official Low',data:eugeneLow,borderColor:s.getPropertyValue('--orange').trim(),borderWidth:1,pointRadius:2,tension:0.3,borderDash:[2,2],fill:false}
    ]},options:{...d,scales:{...d.scales,y:{...d.scales.y,ticks:{...d.scales.y.ticks,callback:v=>v+'°F'}}}}});
  }

  // RECORDS TAB
  async function loadRecordsTab(){
    const tc=document.getElementById('tab-content');
    if(recordsCache.records){renderRecordsTab();return;}
    tc.innerHTML='<div class="loading">Loading records...</div>';
    try{
      const[records,ytd,thisDay]=await Promise.all([fetchRecords(),fetchYTD(),fetchEugeneThisDay()]);
      const latestRes=await fetch(`${SUPABASE_URL}/rest/v1/weather_data?order=recorded_at.desc&limit=1`,{headers:H});
      const latest=(await latestRes.json())[0];
      recordsCache={records,ytd,latest,thisDay};renderRecordsTab();
    }catch(err){tc.innerHTML=`<div class="error">${err.message}</div>`;}
  }
  function renderRecordsTab(){
    const{records,ytd,latest,thisDay}=recordsCache;
    const mmdd=new Date().toLocaleDateString([],{month:'long',day:'numeric'});
    let thisDayHtml='';
    if(thisDay&&thisDay.length){
      const rows=thisDay.map(d=>`<tr><td>${d.date.substring(0,4)}</td><td>${fmt(d.tmax,0)}</td><td>${fmt(d.tmin,0)}</td><td>${fmt(d.prcp,2)}</td><td>${fmt(d.normal_tmax,0)}</td><td>${fmt(d.normal_tmin,0)}</td></tr>`).join('');
      thisDayHtml=`<div class="section-label">This Day in History — ${mmdd} (Eugene Airport) <span class="info-tip">?<span class="tip-text">Official high, low, and rainfall recorded at Eugene Airport on this calendar date in previous years. "Normal" is the 30-year average (1981-2010) for this date. Data from NOAA.</span></span></div>
        <div class="monthly-table-wrap"><table class="monthly-table">
        <thead><tr><th>Year</th><th>High (°F)</th><th>Low (°F)</th><th>Rain (in)</th><th>Normal High</th><th>Normal Low</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    }
    document.getElementById('tab-content').innerHTML=`
      <div class="section-label">All-Time Records <span class="info-tip">?<span class="tip-text">The most extreme readings ever recorded by your personal weather station. These update automatically as new records are set.</span></span></div>
      <div class="records-grid">
        <div class="record-card"><div class="card-label">Hottest</div><div class="record-value">${fmt(records.hot?.temp_outdoor,1)}<span>°F</span></div><div class="record-date">${records.hot?formatDate(records.hot.recorded_at):'--'}</div></div>
        <div class="record-card"><div class="card-label">Coldest</div><div class="record-value">${fmt(records.cold?.temp_outdoor,1)}<span>°F</span></div><div class="record-date">${records.cold?formatDate(records.cold.recorded_at):'--'}</div></div>
        <div class="record-card"><div class="card-label">Rainiest Day</div><div class="record-value">${fmt(records.rain?.rain_daily,2)}<span> in</span></div><div class="record-date">${records.rain?formatDate(records.rain.recorded_at):'--'}</div></div>
        <div class="record-card"><div class="card-label">Strongest Gust</div><div class="record-value">${fmt(records.gust?.wind_gust,1)}<span> mph</span></div><div class="record-date">${records.gust?formatDate(records.gust.recorded_at):'--'}</div></div>
      </div>
      <div class="section-label">Rainfall Totals</div>
      <div class="rain-grid">
        <div class="rain-card"><div class="card-label">Today</div><div class="record-value">${fmt(latest?.rain_daily,2)}<span> in</span></div><div class="record-date">Last hour: ${fmt(latest?.rain_hourly,2)} in</div></div>
        <div class="rain-card"><div class="card-label">This Week</div><div class="record-value">${fmt(latest?.rain_weekly,2)}<span> in</span></div></div>
        <div class="rain-card"><div class="card-label">This Month</div><div class="record-value">${fmt(latest?.rain_monthly,2)}<span> in</span></div></div>
        <div class="rain-card"><div class="card-label">YTD ${new Date().getFullYear()}</div><div class="record-value">${ytd}<span> in</span></div></div>
      </div>
      ${thisDayHtml}`;
  }

  // INIT
  loadLiveTab();
  setInterval(()=>{if(activeTab==='live')loadLiveTab();},5*60*1000);
</script>
